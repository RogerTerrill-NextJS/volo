name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Offline configuration fixtures; never use these to access a database.
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_fixture"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Production smoke tests
        run: npm test
      - name: Supabase request-scoped clients and cookie persistence
        run: npm run test:clients
      - name: Supabase Proxy session refresh and failure handling
        run: npm run test:proxy
      - name: Verified server identity and current membership
        run: npm run test:access
      - name: Protected app pages and login destination
        run: npm run test:protected-app
      - name: Invitation issuance and provider failure handling
        run: npm run test:invitations:unit
      - name: Protected mutation authorization, input limits and origin enforcement
        run: npm run test:mutations
      - name: Private response cache isolation and public cache controls
        run: npm run test:cache
      - name: Supabase browser and server boundaries
        run: npm run test:boundaries

  auth-integration:
    name: Real Auth and session integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify disposable real Auth integration
        timeout-minutes: 20
        run: npm run test:auth:integration
      - name: Stop only the owned integration stack
        if: always()
        run: node scripts/verify-auth-integration.mjs --cleanup
      - name: Upload sanitized Auth integration summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auth-integration-summary
          path: .superpowers/sdd/2026-10-07-volo-119-auth-integration/summary.json
          include-hidden-files: true
          if-no-files-found: warn

  database:
    name: Rebuild database and test access policies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Start local database
        run: npx --no-install supabase db start
      - name: Rebuild with fictional seeds
        run: npm run db:reset
      - name: Test access policies
        run: npm run db:test
      - name: Verify rebuild without seeds
        run: npx --no-install supabase db reset --local --no-seed
      - name: Test policies without seed dependencies
        run: npm run db:test
      - name: Verify invitation upgrade preserves existing accounts and memberships
        run: node scripts/verify-invitation-upgrade.mjs
      - name: Check committed database types
        id: database-types-check
        run: npm run db:types:check
      - name: Generate database types
        if: success() || steps.database-types-check.outcome == 'failure'
        id: generate-database-types
        run: |
          npm run db:types
          # Public schema only; recovery when the generated artifact download fails.
          if [ "${{ steps.database-types-check.outcome }}" = "failure" ]; then
            cat lib/supabase/database.types.ts
          fi
      - name: Upload generated database types
        if: always() && steps.generate-database-types.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: database-types
          path: lib/supabase/database.types.ts
          if-no-files-found: error
      - name: Stop local database
        if: always()
        run: npx --no-install supabase stop
